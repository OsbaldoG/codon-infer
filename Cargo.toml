[package]
name = "codon-infer"
version = "1.4.0"
edition = "2024"
authors = ["Manuel Osbaldo Gastélum Islas <gaimo41027@gmail.com>"]
description = "High-Performance, Zero-Allocation ESM-2 Protein Language Model Inference Engine in Pure Rust"
license = "MIT"
repository = "https://github.com/OsbaldoG/codon-infer"
default-run = "codon-infer"

[dependencies]

[[bin]]
name = "codon-infer"
path = "src/main.rs"

[[bin]]
name = "codon-infer-mcp"
path = "src/mcp_main.rs"
