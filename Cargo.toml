[package]
name = "codon-infer"
version = "0.2.0"
edition = "2024"

[lib]
name = "codon_infer"
path = "src/lib.rs"

[[bin]]
name = "codon-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "codon-mcp"
path = "src/bin/mcp.rs"

[[bench]]
name = "inference_bench"
harness = false

[dependencies]
libm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
ndarray = "0.15"
npyz = { version = "0.9", features = ["npz"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
overflow-checks = false

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"